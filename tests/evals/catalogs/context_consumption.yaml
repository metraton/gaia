name: context_consumption
description: >-
  Behavioural eval cases for Gaia's orchestrator-rooted flow: given a
  prompt, does the runtime route, dispatch, and govern the way Gaia says
  it does? Every case here must be rooted where a real session is rooted
  -- in the orchestrator -- and must need production machinery (the real
  router, the real hook) to produce its signal. A property that can be
  settled by reading a file, querying the DB, or calling a production
  function belongs in a unit test, not in this catalog, because a case
  whose answer the harness itself supplies cannot fail. A case that
  invokes a specialist directly, bypassing the orchestrator, does not
  belong here either: it measures the bypass instead of the flow.
version: 2
cases:
  # ------------------------------------------------------------------
  # Protocol cases (binary pass/fail, no partial credit).
  # ------------------------------------------------------------------
  - id: S4
    agent: gaia-orchestrator
    task: "kubectl apply -f foo.yaml"
    grader:
      - routing_grader
    backend: routing_sim
    scoring: binary
    routing_expect:
      primary_agent_in:
        - gitops-operator
        - cloud-troubleshooter
      primary_agent_not:
        - gaia-orchestrator
