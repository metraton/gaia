name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run trigger. Without it, revalidating a red run required a dummy
  # push, which both burned a full matrix and stacked another queued run.
  workflow_dispatch:

# One live run per ref. Pushes land faster than a full matrix completes (six
# complete runs between 06:24 and 09:17 on 2026-07-24 from stacked pushes), and
# every superseded run was spending the whole matrix on a commit already
# replaced. Cancelling in progress keeps only the run whose result can matter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each tree is tested once. .github/scripts/ci_verdict.py looks for an earlier green
  # "CI verdict" on this commit, on another commit with its tree (the squash of
  # a PR head), or on its parent when only version sources changed; when one
  # exists the pytest shards are skipped and the verdict cites that run. The
  # short jobs still run: validate-manifests and build-plugins are exactly what
  # a version-only commit can break. A pull request is judged by its head, not
  # the merge ref, so the squash landing on main finds the same tree. A failed
  # lookup reports "not reusable", which runs everything.
  decide:
    name: Reuse decision
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reusable: ${{ steps.lookup.outputs.reusable }}
      source_run: ${{ steps.lookup.outputs.source_run }}
      source_url: ${{ steps.lookup.outputs.source_url }}
      reason: ${{ steps.lookup.outputs.reason }}
    steps:
      - uses: actions/checkout@v7

      # Exit 1 (nothing reusable) and 2 (lookup failed) both leave
      # reusable=false; only a crash of the helper itself fails this job.
      - name: Look up a reusable CI verdict
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          status=0
          python3 .github/scripts/ci_verdict.py "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" || status=$?
          test "$status" -le 2

  # The layer-1 suite split across four runners by pytest-split, each shard
  # still under xdist (`-n auto` from pyproject addopts). A single job took
  # 7m08 on run 36181584626; the shards exist to bring a push's full verdict
  # under three minutes without dropping a test.
  test-python:
    name: Python ${{ matrix.python-version }} (shard ${{ matrix.group }}/4)
    needs: decide
    if: ${{ needs.decide.outputs.reusable != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        group: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      # The comparison baseline is not an ancestor of the PR checkout.
      - name: Fetch pinned plugin comparison baseline
        run: |
          git fetch --no-tags --depth=1 origin c407aadd643051d320a3fc90ffbcbe3fdf75cb5a
          git cat-file -e 'c407aadd643051d320a3fc90ffbcbe3fdf75cb5a^{commit}'
          git show c407aadd643051d320a3fc90ffbcbe3fdf75cb5a:opencode/plugin.ts > /dev/null

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # pyproject.toml is named explicitly rather than left to the action's
          # dependency-file discovery: this repo has no requirements.txt, and a
          # `cache: pip` that matches no dependency file fails the step.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      # The Python suite includes tests that shell out to real Node scripts
      # (e.g. tests/cli/test_pre_publish_dry_run_representative.py runs
      # `node bin/pre-publish-validate.js --dry-run`, which imports the `chalk`
      # devDependency). ubuntu-latest ships Node, so those tests do NOT skip --
      # without node_modules they fail with "Cannot find package 'chalk'".
      # Install the dev dependencies so the Node-backed tests resolve chalk.
      - name: Install Node dependencies
        run: npm ci

      # pyyaml: tests/evals/catalog.py and tests/evals/test_security_golden.py
      # both `import yaml` unconditionally at module level to load the eval
      # catalogs (tests/evals/catalogs/*.yaml) -- a different loader from the
      # no-dependency frontmatter parser tests/conftest.py uses elsewhere.
      # Bringing tests/evals into this job's collection (below) makes that
      # import run on every push; without it, collection of those two modules
      # (plus test_evals.py, which imports catalog.py) fails outright.
      # Installed explicitly here, rather than assumed present on the
      # runner image -- ubuntu-latest does not ship pyyaml by default.
      #
      # pytest-xdist and pytest-split are in pyproject.toml's [dev] extra, but
      # this job installs explicit specs rather than `.[dev]`, so each must be
      # named here. pytest-split is pinned because every shard must compute the
      # same partition; an algorithm change between versions would reshuffle it.
      - name: Install test dependencies
        run: pip install pytest==8.3.5 pyyaml pytest-xdist pytest-split==0.11.0

      # Bare pytest: the selection is testpaths (pyproject.toml) minus
      # LAYER1_EXCLUDED (tests/conftest.py), the same one `npm test` runs, so
      # no path is repeated here. No -x: a red run reports every failure.
      #
      # least_duration partitions by the versioned .test_durations; a test
      # missing from it counts as the average. Each shard reads a copy of that
      # file and rewrites the copy with only its own measured tests, uploaded
      # as test-durations-N and merged by the test-durations job below, whose
      # artifact is what refreshes the committed file.
      #
      # Every pytest-split option is spelled --name=value. pytest picks its
      # rootdir and pyproject.toml from the path-like arguments before plugin
      # options exist, so a separate-token durations path under $RUNNER_TEMP
      # moved the rootdir to /home/runner/work: no configfile, hence no
      # testpaths, no `-n auto` and no LAYER1 exclusions (run 36487229785).
      - name: Run tests
        run: |
          cp .test_durations "$RUNNER_TEMP/durations-${{ matrix.group }}.json"
          python -m pytest -q --tb=short \
            --splits=4 --group=${{ matrix.group }} --splitting-algorithm=least_duration \
            --durations-path="$RUNNER_TEMP/durations-${{ matrix.group }}.json" \
            --store-durations --clean-durations

      - name: Upload shard durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ matrix.group }}
          path: ${{ runner.temp }}/durations-${{ matrix.group }}.json
          retention-days: 30

  test-durations:
    name: Merge test durations
    needs: test-python
    if: ${{ !cancelled() && needs.test-python.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-durations-*
          merge-multiple: true
          path: shards

      - name: Merge shard durations into .test_durations
        run: jq -S -s add shards/durations-*.json > .test_durations

      - uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true
          retention-days: 30

  l2-ci-subset:
    name: L2 ci_subset (budget-bounded LLM)
    runs-on: ubuntu-latest
    # Budget guard: the subset only spends tokens on push to main, and only when
    # the ANTHROPIC_API_KEY secret is configured. On secretless runs the step
    # no-ops, so the subset never burns budget unexpectedly (brief #89 AC-6).
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: pip install pytest==8.3.5

      - name: Run L2 ci_subset under controlled budget
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not configured -- skipping L2 ci_subset (no budget spent)."
            exit 0
          fi
          # Bounded subset only: -m ci_subset selects the marked L2 tests; the
          # subset is intentionally tiny (2 single-filter routing cases) to keep
          # per-CI token spend small. No full-suite L2 run here.
          python -m pytest tests/layer2_llm_evaluation -m ci_subset -q --tb=short

  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build-plugins:
    name: Build Plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Single unified plugin (gaia-ops / gaia-security are retired). There is
      # no dist/ bundle: under source:npm the repo root IS the plugin, so the
      # only build step regenerates the two generated manifests in place --
      # the same invocation as package.json's `generate:plugin-root` script.
      - name: Generate plugin root manifests
        run: python3 scripts/build-plugin.py gaia --manifests-only --output-dir .

      - name: Verify build outputs
        run: |
          test -f .claude-plugin/plugin.json
          test -f hooks/hooks.json
          echo "Plugin manifests verified"

  validate-manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests (version drift check)
        run: npm run pre-publish:validate

  # ==========================================================================
  # Windows compatibility -- the evidence source for the Windows artifact
  # acceptance criteria (brief gaia-windows-compatibility: AC-2/4/6/8).
  #
  # Every other job runs on ubuntu-latest, so before this job Gaia had ZERO
  # Windows coverage. This job runs the landed compatibility fixes on a REAL
  # windows-latest runner, so each is exercised on the platform it targets:
  #   * hooks/modules/core/filelock.py     -- removes the POSIX-only `import
  #                                            fcntl` crash (#5); msvcrt on Win
  #   * bin/cli/_install_helpers.py        -- forward-slash (.as_posix) paths
  #                                            (the installer bad-escape, #2) +
  #                                            symlink copy/junction fallback
  #                                            for an unprivileged Windows host
  #   * scripts/bootstrap_database.py      -- DB bootstrap with NO `sqlite3`
  #                                            CLI and NO `bash` in PATH
  #   * `gaia doctor` hooks-importable check
  #
  # Step -> AC map:
  #   AC-2  "AC-2 -- hooks import on Windows"      (fcntl / POSIX-only imports)
  #   AC-4  "AC-4 -- gaia install exits 0"         (install success on Windows)
  #   AC-6  "AC-6 -- gaia doctor is green"         (no RED checks; symlinks 7/7
  #                                                 or recognized copy fallback)
  #   AC-8  "AC-8 -- runtime smoke"                (whole job + the runtime
  #                                                 post_tool_use / T3 grant /
  #                                                 FTS5 smoke)
  #
  # rc.2 launcher/workspace-resolution extension (Step -> what it proves):
  #   "RC-2 launcher-generated"            -> `gaia install --path` (opt-in)
  #        emits gaia.cmd + gaia.ps1 (install.py Step 6.5) AND gaia.ps1 runs in
  #        the MIDDLE of a pipeline (the rc.1 "Cannot run a document in the
  #        middle of a pipeline" bug); also evidences the baked `python` token
  #        (POSIX bakes `python3`) resolves on windows-latest.
  #   "RC-2 resolution-workspace-via-env"  -> `gaia doctor` invoked THROUGH the
  #        generated launcher WITHOUT --workspace resolves the correct workspace
  #        from the baked GAIA_WORKSPACE_PATH and reports 0 RED checks. AC-4/AC-6
  #        used --no-path + explicit --workspace and so skipped BOTH the launcher
  #        and the env-derivation path -- which is why the user-only false
  #        CRITICAL never surfaced in CI. These two steps exercise them.
  #
  # rc.3 setx-persistence extension (Step -> what it proves):
  #   "RC-3 setx-persistence"        -> `gaia install` on Windows PERSISTS
  #        GAIA_WORKSPACE_PATH to the USER environment (install.py Step 6.6,
  #        _persist_workspace_env -> `setx`; only with the --path opt-in). The
  #        RC-2 launcher-generated step above already ran `gaia install` into
  #        _ws, so setx has fired. This step reads the value back from where
  #        setx writes it -- HKCU\Environment, surfaced by
  #        [Environment]::GetEnvironmentVariable('GAIA_WORKSPACE_PATH','User') --
  #        and asserts it equals the installed workspace.
  #   "RC-3 doctor-via-npm-shim"     -> reproduces the user's MACHINE 2: `gaia`
  #        resolved via npm's GLOBAL SHIM (not Gaia's ~/.local/bin launcher), so
  #        the launcher's process-scoped GAIA_WORKSPACE_PATH export never runs
  #        and __file__ lands outside the workspace's node_modules -> doctor
  #        derived the npm prefix and emitted a false CRITICAL. In CI this is
  #        modeled by invoking `python bin/gaia doctor --json` DIRECTLY (bin/gaia
  #        lives outside node_modules, exactly like the shim's __file__; neither
  #        runs the launcher, neither self-exports the env var). A NEGATIVE
  #        CONTROL first proves that WITHOUT the persisted env doctor cannot
  #        resolve (no JSON, exit 2) -- the machine-2 failure, reproduced. Then,
  #        with GAIA_WORKSPACE_PATH sourced from the setx-persisted USER env and
  #        handed to a fresh doctor child, doctor resolves the workspace and
  #        reports 0 RED -> HEALTHY, WITHOUT --workspace. Note on setx timing:
  #        setx targets FUTURE processes and the Actions runner does NOT
  #        re-broadcast WM_SETTINGCHANGE mid-job, so a naive later step would not
  #        auto-inherit it; we therefore READ the persisted USER value and inject
  #        it into the doctor child explicitly -- the same inheritance a fresh
  #        shell gets automatically on the user's box (it reads HKCU\Environment
  #        at spawn). The SOURCE is the setx-persisted var; only the injection
  #        mechanism is manual.
  #
  # The heavy assertions (import-every-hook, parse doctor JSON for red checks,
  # drive the hook entry points + verify the DB) live in the committed helper
  # tests/ci/windows_smoke.py so the YAML stays declarative and shell-agnostic.
  # ==========================================================================
  windows-compat:
    name: Windows compatibility (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare workspace + data dirs
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/_ws" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/_gaia" | Out-Null

      # AC-2 -- every module under hooks/ must import on Windows. This is the
      # instant catcher for the fcntl regression (#5): a POSIX-only import
      # raises ModuleNotFoundError here, by module name, before any hook runs.
      # (Re-checked at runtime in AC-8 and by `gaia doctor` in AC-6.)
      - name: AC-2 -- hooks import on Windows
        run: python tests/ci/windows_smoke.py imports

      # AC-4 -- `gaia install` must exit 0 on Windows. Exercises the
      # cross-platform bootstrap (no sqlite3 CLI, no bash), the forward-slash
      # settings paths, and the symlink copy/junction fallback on an
      # unprivileged host. --no-path skips the POSIX ~/.local/bin launcher.
      - name: AC-4 -- gaia install exits 0 on Windows
        env:
          GAIA_DB: ${{ github.workspace }}/_gaia/gaia.db
        run: >-
          python bin/gaia install
          --channel npm
          --workspace "${{ github.workspace }}/_ws"
          --db-path "${{ github.workspace }}/_gaia/gaia.db"
          --no-path

      # AC-6 -- `gaia doctor` must report NO red (error) checks on Windows.
      # windows_smoke.py parses `gaia doctor --json` and fails only on
      # severity=error (warnings tolerated), so this asserts the exact AC:
      # hooks-importable passes and Symlinks is 7/7 (real links, or the
      # recognized version-stamped copy fallback).
      - name: AC-6 -- gaia doctor is green on Windows
        env:
          GAIA_DB: ${{ github.workspace }}/_gaia/gaia.db
        run: python tests/ci/windows_smoke.py doctor --workspace "${{ github.workspace }}/_ws"

      # AC-8 -- the artifact works end to end on Windows. In a self-isolated
      # throwaway data dir, windows_smoke.py: (a) drives hooks/post_tool_use.py
      # with a synthetic critical-event payload so the filelock backend is
      # acquired/released at RUNTIME (not just imported); (b) runs the T3 grant
      # cycle block -> activate -> retry, activating at the DB plane under a
      # DIFFERENT session so the check does not depend on the host's activation
      # route (risk R3), verifying the pending-row lifecycle in the DB; and
      # (c) inserts an episode and confirms the episodes_fts mirror stays synced
      # via its AFTER INSERT trigger. The whole job passing + this smoke is AC-8.
      - name: AC-8 -- runtime smoke (post_tool_use + T3 grant + FTS5)
        run: python tests/ci/windows_smoke.py smoke

      # RC-2 (launcher-generated) -- proves what AC-4 structurally cannot: AC-4
      # passes --no-path, which SKIPS install.py Step 6.5 entirely, so the
      # Windows launcher was never generated in CI and the rc.1 launcher bug
      # (extensionless bash shim that PowerShell rejected in a pipeline with
      # "Cannot run a document in the middle of a pipeline") only ever appeared
      # on the user's machine. Here we re-install into the SAME workspace AC-6
      # validated, this time WITH the --path opt-in, so gaia.cmd + gaia.ps1 are
      # actually written to ~/.local/bin (install._install_windows_launchers).
      # We assert BOTH files exist, evidence which `python` the launcher bakes
      # (POSIX bakes `python3`; Windows must resolve `python`), and then drive
      # gaia.ps1 IN THE MIDDLE OF A PIPELINE inside a child pwsh -- the child so
      # the launcher's trailing `exit` cannot terminate this step early -- and
      # require exit 0 with a `gaia <version>` line. `--version` needs no DB and
      # no workspace, so this isolates the pipeability + python-token surface.
      - name: RC-2 launcher-generated -- gaia.cmd/gaia.ps1 emitted + ps1 pipeable
        env:
          GAIA_DB: ${{ github.workspace }}/_gaia/gaia.db
        run: |
          python bin/gaia install --channel npm --path --workspace "${{ github.workspace }}/_ws" --db-path "${{ github.workspace }}/_gaia/gaia.db"
          if ($LASTEXITCODE -ne 0) { Write-Error "gaia install --path failed with exit $LASTEXITCODE"; exit 1 }
          $base = Join-Path $HOME ".local/bin"
          $cmd  = Join-Path $base "gaia.cmd"
          $ps1  = Join-Path $base "gaia.ps1"
          if (-not (Test-Path -LiteralPath $cmd)) { Write-Error "gaia.cmd NOT created at $cmd (Step 6.5 launcher missing)"; exit 1 }
          if (-not (Test-Path -LiteralPath $ps1)) { Write-Error "gaia.ps1 NOT created at $ps1 (Step 6.5 launcher missing)"; exit 1 }
          Write-Host "launchers present: $cmd ; $ps1"
          # Evidence: the launcher template bakes `python "<bin>" %*` / `& python`.
          # POSIX bakes `python3`; on windows-latest `python` must resolve.
          $py = Get-Command python -ErrorAction SilentlyContinue
          if ($null -eq $py) { Write-Error "no 'python' on PATH -- the launcher bakes 'python', not 'python3'"; exit 1 }
          Write-Host "launcher 'python' token resolves to: $($py.Source)"
          # Pipeability: run gaia.ps1 in the MIDDLE of a pipeline, in a child pwsh
          # (its trailing `exit` must not kill this step). Require exit 0.
          $probe = "& '$ps1' --version | Out-String"
          $out = (pwsh -NoProfile -Command $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { Write-Error "gaia.ps1 not pipeable (exit $LASTEXITCODE): $out"; exit 1 }
          if ($out -notmatch '^gaia ') { Write-Error "gaia.ps1 ran in a pipeline but output was unexpected: '$out'"; exit 1 }
          Write-Host "gaia.ps1 pipeable OK -> $out"
          exit 0

      # RC-2 (resolution-workspace-via-env) -- `gaia doctor` invoked THROUGH the
      # generated gaia.ps1, WITHOUT --workspace. The launcher exports the baked
      # GAIA_WORKSPACE_PATH, which doctor._derive_workspace honors BEFORE its
      # __file__ derivation (and after --workspace). This reproduces the user's
      # real invocation path (a global shim with no --workspace), which AC-6
      # bypassed by passing --workspace explicitly. In CI bin/gaia lives OUTSIDE
      # any node_modules, so WITHOUT the baked env var _derive_workspace exits 2
      # ("global or symlinked install detected") and prints NO JSON -- exactly
      # the false CRITICAL. WITH the launcher's baked env var it must resolve the
      # installed workspace and report 0 RED checks. Run in a child pwsh (the
      # launcher's trailing `exit` must not kill this step); absence of parseable
      # JSON is itself the regression signal.
      - name: RC-2 resolution-workspace-via-env -- doctor via launcher is HEALTHY
        env:
          GAIA_DB: ${{ github.workspace }}/_gaia/gaia.db
        run: |
          $ps1 = Join-Path (Join-Path $HOME ".local/bin") "gaia.ps1"
          if (-not (Test-Path -LiteralPath $ps1)) { Write-Error "gaia.ps1 missing; the launcher-generated step must run first"; exit 1 }
          # Invoke doctor THROUGH the launcher (no --workspace), in a pipeline.
          $raw = (pwsh -NoProfile -Command "& '$ps1' doctor --json" | Out-String)
          try {
            $doc = $raw | ConvertFrom-Json
          } catch {
            Write-Error "doctor via launcher emitted no parseable JSON -- _derive_workspace likely exited 2 (regression: baked GAIA_WORKSPACE_PATH not honored). raw output:`n$raw"
            exit 1
          }
          foreach ($c in $doc.checks) { Write-Host ("   [{0,-7}] {1}: {2}" -f $c.severity, $c.name, $c.detail) }
          $errs = @($doc.checks | Where-Object { $_.severity -eq 'error' })
          if ($errs.Count -gt 0) {
            Write-Error "doctor via launcher reported $($errs.Count) RED check(s) -- wrong/uninitialized workspace resolved from GAIA_WORKSPACE_PATH"
            foreach ($e in $errs) { Write-Host "   - $($e.name): $($e.detail)" }
            exit 1
          }
          Write-Host "doctor via launcher HEALTHY (status=$($doc.status), 0 red) -- GAIA_WORKSPACE_PATH resolution OK"
          exit 0

      # RC-3 (setx-persistence) -- proves the PERSISTENCE half of the rc.3 fix:
      # `gaia install` on Windows writes GAIA_WORKSPACE_PATH to the USER env via
      # `setx` (install.py Step 6.6, _persist_workspace_env). The RC-2
      # launcher-generated step above already ran `gaia install` into _ws (setx
      # fires there, even without --no-path), so here we only READ it back from
      # where setx persists it -- HKCU\Environment, exposed by
      # [Environment]::GetEnvironmentVariable(...,'User') -- and assert it points
      # at the installed workspace. Without this persistence, when npm's shim
      # wins PATH the launcher never exports the var and doctor derives the npm
      # prefix (the machine-2 false CRITICAL that RC-3 doctor-via-npm-shim below
      # exercises end to end).
      - name: RC-3 setx-persistence -- GAIA_WORKSPACE_PATH persisted to user env
        run: |
          $expected = (Resolve-Path -LiteralPath "${{ github.workspace }}/_ws").Path
          $persisted = [Environment]::GetEnvironmentVariable('GAIA_WORKSPACE_PATH','User')
          if ([string]::IsNullOrWhiteSpace($persisted)) {
            Write-Error "GAIA_WORKSPACE_PATH was NOT persisted to the user env -- setx (install.py Step 6.6) did not run or failed"
            exit 1
          }
          Write-Host "persisted GAIA_WORKSPACE_PATH (user env) = $persisted"
          # Normalize both to canonical full paths; PATH entries and setx values
          # vary in case/separators on Windows, so compare case-insensitively.
          $persistedNorm = [System.IO.Path]::GetFullPath($persisted).TrimEnd('\')
          $expectedNorm  = [System.IO.Path]::GetFullPath($expected).TrimEnd('\')
          if ($persistedNorm -ine $expectedNorm) {
            Write-Error "persisted workspace '$persistedNorm' != installed workspace '$expectedNorm'"
            exit 1
          }
          Write-Host "RC-3 setx-persistence OK -> user env resolves to the installed workspace ($persistedNorm)"
          exit 0

      # RC-3 (doctor-via-npm-shim) -- reproduces the user's MACHINE 2 and proves
      # the setx persistence fixes it. `gaia` resolved via npm's global shim (NOT
      # Gaia's ~/.local/bin launcher): the launcher's process-scoped env export
      # never runs, and __file__ lands outside the workspace's node_modules, so
      # doctor._derive_workspace cannot infer a workspace and (without the fix)
      # exits 2 -> false CRITICAL. We model the shim by invoking `python bin/gaia
      # doctor --json` DIRECTLY -- in CI bin/gaia is outside node_modules, exactly
      # like the shim's __file__, and neither runs the launcher nor self-exports
      # GAIA_WORKSPACE_PATH. A NEGATIVE CONTROL first confirms the bug is real
      # (no env -> no JSON), then the persisted USER value is injected into a
      # fresh doctor child and doctor must be HEALTHY WITHOUT --workspace. Both
      # doctor invocations run in a CHILD pwsh (mirroring the RC-2 step) so the
      # child's exit code / stderr cannot fail this step -- parseable JSON, or its
      # absence, is the signal. On setx timing: setx applies to FUTURE processes
      # and the runner does not re-broadcast mid-job, so we READ the persisted
      # value and inject it explicitly -- the same env a fresh shell inherits
      # automatically on the user's machine (only the injection is manual; the
      # SOURCE is the setx-persisted var).
      - name: RC-3 doctor-via-npm-shim -- doctor without --workspace is HEALTHY
        env:
          GAIA_DB: ${{ github.workspace }}/_gaia/gaia.db
        run: |
          # --- Negative control: WITHOUT the persisted env, doctor must NOT
          # resolve a workspace. Proves the reproduction is genuine (the bug is
          # real) rather than an always-green assertion.
          Remove-Item Env:GAIA_WORKSPACE_PATH -ErrorAction SilentlyContinue
          $ctl = (pwsh -NoProfile -Command "python bin/gaia doctor --json" | Out-String)
          $ctlResolved = $false
          try {
            $ctlDoc = $ctl | ConvertFrom-Json
            if ($ctlDoc -and $ctlDoc.checks) { $ctlResolved = $true }
          } catch { $ctlResolved = $false }
          if ($ctlResolved) {
            Write-Error "control FAILED: doctor resolved a workspace WITHOUT the persisted env -- machine-2 is not being reproduced (bin/gaia must be outside node_modules). raw:`n$ctl"
            exit 1
          }
          Write-Host "control OK: without GAIA_WORKSPACE_PATH, doctor cannot resolve (no JSON / exit 2) -- machine-2 false CRITICAL reproduced."

          # --- The fix: source GAIA_WORKSPACE_PATH from the setx-persisted USER
          # env and hand it to a fresh doctor child (a new process inherits it,
          # just as a fresh shell would on the user's box). Invoke bin/gaia
          # DIRECTLY (npm-shim stand-in), WITHOUT --workspace.
          $persisted = [Environment]::GetEnvironmentVariable('GAIA_WORKSPACE_PATH','User')
          if ([string]::IsNullOrWhiteSpace($persisted)) {
            Write-Error "GAIA_WORKSPACE_PATH is not persisted in the user env -- the setx step (install.py 6.6) must run first."
            exit 1
          }
          $env:GAIA_WORKSPACE_PATH = $persisted
          Write-Host "doctor via bin/gaia (npm-shim path, no --workspace), GAIA_WORKSPACE_PATH=$persisted"
          $raw = (pwsh -NoProfile -Command "python bin/gaia doctor --json" | Out-String)
          try {
            $doc = $raw | ConvertFrom-Json
          } catch {
            Write-Error "doctor emitted no parseable JSON even WITH the persisted env -- the setx fix did not resolve the workspace. raw output:`n$raw"
            exit 1
          }
          foreach ($c in $doc.checks) { Write-Host ("   [{0,-7}] {1}: {2}" -f $c.severity, $c.name, $c.detail) }
          $errs = @($doc.checks | Where-Object { $_.severity -eq 'error' })
          if ($errs.Count -gt 0) {
            Write-Error "doctor via npm-shim path reported $($errs.Count) RED check(s) -- wrong/uninitialized workspace resolved from the persisted env"
            foreach ($e in $errs) { Write-Host "   - $($e.name): $($e.detail)" }
            exit 1
          }
          Write-Host "RC-3 doctor-via-npm-shim HEALTHY (status=$($doc.status), 0 red) WITHOUT --workspace -- setx persistence fixes the machine-2 scenario."
          exit 0

  # The tarball the upgrade cells install. Packed once, on Linux, because
  # that is where a release is packed: a Windows user installs a tarball built
  # here, never one built on Windows. It does not wait for decide so the cells
  # start as soon as the lookup ends; it is in the verdict's needs because a
  # failed pack skips every cell, and a skipped cell alone reads as green.
  pack:
    name: Pack the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: npm pack
        run: |
          mkdir pack-out
          npm pack --silent --pack-destination pack-out

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: pack-out/*.tgz
          retention-days: 7

  # Every published database base (the dumps under
  # tests/fixtures/published_bases, one per release that changed the schema)
  # upgraded by `gaia migrate` from the installed tarball, then both install
  # channels run their registered hook command as written and `gaia uninstall`
  # must leave no manifest behind. The dumps are versioned, so no checkout here
  # needs tags or history. Windows is in the matrix because the hook command
  # starts with `sh`, and every path the package sees there contains a space.
  # Skipped with the shards when decide found this tree already green, and run
  # beside them otherwise, so the cells add no wall time as long as each one
  # finishes before the slowest shard. tests/ci/upgrade_smoke.py holds the
  # steps and their assertions.
  upgrade:
    name: Upgrade v${{ matrix.base }} (${{ matrix.os }})
    needs: [decide, pack]
    if: ${{ needs.decide.outputs.reusable != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        base: [21, 26, 33, 37, 51, 57]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pack-out

      - name: Upgrade v${{ matrix.base }}, install both channels, run the hooks, uninstall
        run: python tests/ci/upgrade_smoke.py --base ${{ matrix.base }} --pack-dir pack-out --root "${{ runner.temp }}/gaia upgrade"

  # The one check that summarizes the tree: green only when every job it
  # needs succeeded or was skipped by its own condition (l2-ci-subset outside
  # push, the shards when decide found a reusable verdict). A job that judges
  # the tree must be appended to `needs`, or its failure no longer reaches the
  # verdict; the checks below read `needs` whole and need no edit.
  #
  # test-durations is deliberately absent: it measures the suite for the next
  # partition and says nothing about this tree. Since ci_verdict.py reuses
  # this job's result, depending on it would make a failed artifact merge
  # send an already-tested tree back through the suite.
  ci-verdict:
    name: CI verdict
    needs:
      - decide
      - test-python
      - l2-ci-subset
      - lint-js
      - build-plugins
      - validate-manifests
      - windows-compat
      - pack
      - upgrade
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"

      - name: Cite the reused verdict
        if: ${{ needs.decide.outputs.reusable == 'true' }}
        env:
          SOURCE_RUN: ${{ needs.decide.outputs.source_run }}
          SOURCE_URL: ${{ needs.decide.outputs.source_url }}
          REASON: ${{ needs.decide.outputs.reason }}
        run: |
          echo "Suite not rerun: run $SOURCE_RUN already passed this tree ($REASON) $SOURCE_URL"

      - name: Fail unless every job succeeded or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
