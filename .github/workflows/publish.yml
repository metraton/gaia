name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions: read lets ci_verdict.py and `gh run list` read ci.yml's runs.
      actions: read
      # The OIDC token npm trusted publishing exchanges for a publish
      # credential; without it `npm publish` has no way to authenticate.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Nothing is published unless ci.yml has passed the tagged tree: a green
      # "CI verdict" on the tag's commit, or on its parent when the tag only
      # bumped versions (.github/scripts/ci_verdict.py decides which). The tag
      # arrives seconds after the push that starts CI, so the verdict is
      # awaited; a red run, no run, or VERDICT_WAIT_SECONDS elapsing stops the
      # job here, naming the commit and the run consulted.
      - name: Require a green CI verdict for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERDICT_WAIT_SECONDS: 1200
          POLL_SECONDS: 30
        run: |
          sha=$(git rev-parse "refs/tags/${TAG}^{commit}")
          deadline=$(( SECONDS + VERDICT_WAIT_SECONDS ))
          while true; do
            if python3 .github/scripts/ci_verdict.py "$sha" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --limit 1 \
                    --json databaseId,status,conclusion,url \
                    --jq '.[0] | "\(.databaseId) \(.status)/\(.conclusion) \(.url)"') || run="lookup failed"
            run=${run:-"none (ci.yml has no run for this commit)"}
            case "$run" in
              *" completed/failure "*)
                echo "::error::CI verdict for $sha ($TAG) is red: run $run. Not publishing."
                exit 1
                ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::error::No green CI verdict for $sha ($TAG) after ${VERDICT_WAIT_SECONDS}s; last ci.yml run consulted: $run. Not publishing."
              exit 1
            fi
            echo "Waiting for a green CI verdict on $sha; ci.yml run: $run"
            sleep "$POLL_SECONDS"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0; '22' resolves to the
          # newest 22.x release.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10, and trusted publishing needs npm >= 11.5.1.
      - name: Install npm for trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Pack tarball
        # Produce the exact artifact that would be published. `npm pack` runs
        # the `prepack` script (clean + generate:plugin-root), which regenerates
        # the root .claude-plugin/plugin.json and hooks/hooks.json from the
        # manifest, making the tarball root a valid `source: npm` Claude Code
        # plugin. The sandbox harness installs FROM this tarball, so the gate
        # validates precisely what npm publish would ship, not the working tree.
        id: pack
        run: |
          # `--silent` does not quiet the prepack script's stdout, which shares
          # this stream and would make TARBALL multi-line; npm pack --json always
          # ends stdout with a JSON array, so the filename is parsed from that.
          PACK_JSON=$(npm pack --json)
          TARBALL=$(node -p "JSON.parse(process.argv[1].slice(process.argv[1].indexOf('[')))[0].filename" "$PACK_JSON")
          echo "tarball=${PWD}/${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "Packed ${TARBALL}"

      - name: Run validation
        # Runs AFTER pack so it sees the freshly regenerated root manifests.
        run: npm run pre-publish:validate

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-rc."* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta."* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-alpha."* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Sandbox validation harness (PRE-PUBLISH GATE)
        # End-to-end consumer-install verification against the PACKED TARBALL.
        # Installs into an ephemeral sandbox populated from
        # tests/fixtures/sandbox-project/ and exercises install-time code
        # paths (postinstall merge, FTS5 backfill) plus read-side CLI
        # surface (version, doctor, status, context, memory stats/search,
        # scan, preservation checksum). The harness exit code is the gate:
        # if it fails, npm publish below never runs and no broken artifact
        # reaches the registry.
        run: |
          bash bin/validate-sandbox.sh --tarball "${{ steps.pack.outputs.tarball }}" --target sandbox

      - name: Publish to npm
        # Runs only after the CI verdict and the sandbox harness passed, and
        # publishes the tarball the harness validated. Authentication is npm
        # trusted publishing: npm trades this job's OIDC token for a credential
        # bound to metraton/gaia + publish.yml (the publisher registered on
        # npmjs.com), which requires package.json repository.url to name that
        # repository, and attaches provenance itself. No npm token is read.
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Clean build artifacts
        run: npm run clean

      - name: Notify success
        if: success()
        run: echo "Package gated, published, and smoke-installed successfully"
