# PRINCIPLE 2 — "A grid holds cells or zones, and mixing them changes what
# every dial means."
#
# The principle nobody knows and the hardest one to show, so the page shows it
# by PUTTING THE TWO SIDE BY SIDE: a grid of CELLS on the left, a grid of ZONES
# on the right, and the text of every box says what happens to one dial on its
# own side. Row 2 then adds the case neither side covers: the page ROOT is a level
# whose children are all sections — a zones level — and it becomes a REAL GRID
# anyway the moment one of those sections is a full-width band. So `span` is read
# as TRACKS one level above the level where the same number is read as a WEIGHT,
# and both readings sit on this page one nesting apart.
#
# FORM: comparison. Deliberate: the page's whole argument is "these two levels
# look alike and behave differently", which is a comparison and nothing else.
# The form also drops the word-fit floor (scoped to the narrative forms) and
# keeps the orphan-row check — the right trade for a page whose cells carry
# dial names rather than prose.
#
# WHAT IT EXERCISES: a leaf grid vs a compound grid · a nested section as a zone
# · `treatment: [envelope]` as the container frame · `span` as a RELATIVE WEIGHT
# in the legitimate 2:1 split · `span` as a PARTIAL TRACK COUNT at the root band
# grid (1 < 3 < 4 — the only place a compound level counts tracks, and the shape
# the render gate's invariant Q measures) · vertical separators dividing zones on
# one row — mixing done on purpose, which is legal, not forbidden.

id: p2-cells-or-zones
layout: grid
form: comparison
# Four root columns, read in pairs: the two sides of the comparison take 2 tracks
# each on row 1 (the halves they have always been), row 2 is a 3+1 PARTIAL split,
# and the band beneath closes the page across all four. Four rather than two
# because a partial span needs a row it can be partial OF: with 2 columns every
# root child is either one track or a band, and the shape below — a section that
# takes SOME of the tracks and leaves the rest to a sibling — cannot be authored at
# all. Because one child IS a full-width band the root is laid out as a real
# 4-track grid, so a root child's `span` is a TRACK COUNT here. Below the 1440px
# stack breakpoint the root leaves the grid and every section stacks full-width,
# which is why no tier under it reads `span` at all.
columns: 4

sections:

  # ── ROW 1, LEFT · a grid of CELLS: every dial means what it says ──────────
  - id: p2-cells
    title: "A grid of cells"
    subtitle: "every child is a leaf — this level is a real grid of tracks and rows"
    variant: neutral
    order: 1
    span: 2
    columns: 2
    children:
      - id: p2-c-columns
        order: 1
        kicker: COLUMNS
        title: "columns: 2"
        description:
          - "declares two real tracks"
          - "equal fr shares of the width"
        detail: "In a leaf grid <code>columns: N</code> is literal: the engine emits <code>repeat(N, minmax(--cell-min-w, 1fr))</code> and the cells divide the section edge to edge. This is the only kind of level where the number you write is a track count."
        variant: neutral
      - id: p2-c-span
        order: 2
        kicker: SPAN
        title: "span merges"
        description:
          - "span: M takes M of the"
          - "tracks that already exist"
        detail: "Here <code>span</code> is an Excel-style merge measured in TRACKS: <code>span: 2</code> in a 3-track grid occupies exactly two of them, and <code>span == columns</code> becomes a full-width band. The number refers to something real that the grid already drew."
        variant: neutral
      - id: p2-c-rowspan
        order: 3
        kicker: ROWSPAN
        title: "rowspan works"
        description:
          - "a cell can be K rows tall"
          - "because rows exist here"
        detail: "The vertical merge only means something where there are rows to merge. A leaf grid has them — fixed <code>--cell-h</code> tracks — so <code>rowspan: K</code> makes a cell K slots tall and height becomes a channel you can encode magnitude in."
        variant: neutral
      - id: p2-c-checks
        order: 4
        kicker: CHECKS
        title: "The checks apply"
        description:
          - "closure, dead track, slot"
          - "height: all measured here"
        detail: "The cell-level invariants are asserted at exactly this level: the closure identity <code>Σ(spanCols × rowspanRows) == tracks × rows</code>, the dead-track check, the orphan row, the uniform slot height. A defect on this side is caught by arithmetic."
        variant: neutral

  # ── ROW 1, RIGHT · a grid of ZONES: the same dials, different meanings ────
  # ONE nested section is enough to turn a level compound; here there are two, so
  # this level is a flex row of zones. `treatment: [envelope]` frames it as a
  # container without making any colour claim — the two axes are independent.
  - id: p2-zones
    title: "A grid of zones"
    subtitle: "one nested section is enough: this level became a flex row of zones"
    variant: neutral
    treatment: [envelope]
    order: 2
    span: 2
    columns: 2
    children:
      - id: p2-z-changed
        title: "What changes"
        variant: neutral
        order: 1
        columns: 1
        children:
          - id: p2-z-columns
            order: 1
            kicker: COLUMNS
            title: "columns is inert"
            description:
              - "no tracks are created here"
              - "the row is flex, not a grid"
            detail: "A compound level is a flex-wrap row of sections, so <code>columns</code> no longer emits tracks. It survives only as the label the CSS steps the collapse by. Writing <code>columns: 6</code> on a level whose children are sections changes nothing at all."
            variant: neutral
          - id: p2-z-span
            order: 2
            kicker: SPAN
            title: "span is a weight"
            description:
              - "a ratio between siblings,"
              - "not a count of tracks"
            detail: "On this side <code>span</code> becomes <code>flex-grow</code>: <code>span: 2</code> beside <code>span: 1</code> means twice as wide as its sibling, whatever the parent's <code>columns</code> says. It is a proportion, and the band beneath is the legitimate use of it."
            variant: neutral
      - id: p2-z-lost
        title: "What is lost"
        variant: neutral
        order: 2
        columns: 1
        children:
          - id: p2-z-rowspan
            order: 1
            kicker: ROWSPAN
            title: "No rowspan"
            description:
              - "there are no rows to merge"
              - "so the dial has no meaning"
            detail: "A flex row has no row model, so <code>rowspan</code> on a zone has nothing to consume. The schema accepts the field and the render ignores it — which is exactly why the principle has to be known rather than discovered."
            variant: neutral
          - id: p2-z-checks
            order: 2
            kicker: CHECKS
            title: "Checks step back"
            description:
              - "no tracks, so no closure"
              - "and no dead-track check"
            detail: "The cell invariants stop measuring a compound level: there is no rectangle to close and no track to declare dead. What is still asserted is the flex behaviour — that a zone's width follows its authored weight, that a lone leaf on the row stays content-sized, that no sibling overflows onto the next."
            variant: neutral

  # ── ROW 2 · THE LEGITIMATE USE — span as a weight, a 2:1 split ────────────
  # This row is where the page's two readings of `span` MEET, one nesting apart:
  #   • at the ROOT this section's `span: 3` is THREE OF FOUR TRACKS, because the
  #     root is a real grid (`grid-column: span var(--span)`); the sibling beside it
  #     takes the fourth and the row closes.
  #   • INSIDE it, `columns: 3` is INERT (the children are sections) and what
  #     divides the row is the RATIO 2:1 between the authored spans.
  # The same dial, read as a track count above and as a weight below — which is why
  # the render gate measures both here (invariant Q, rendered width vs authored
  # span, on every side-by-side row of either kind).
  - id: p2-weight
    title: "span as weight — a 2:1 split"
    subtitle: "the honest reason to mix: one row, two zones, one twice the other"
    variant: neutral
    order: 3
    span: 3
    columns: 3
    children:
      - id: p2-w-heavy
        title: "Two thirds"
        subtitle: "span: 2"
        variant: neutral
        order: 1
        span: 2
        columns: 2
        children:
          - id: p2-w-h1
            order: 1
            kicker: WEIGHT
            title: "span: 2 of a 2+1 row"
            description:
              - "flex-grow 2 beside a 1:"
              - "two thirds of the width"
            detail: "The parent's <code>columns: 3</code> creates no tracks here — the split is the RATIO of the two authored spans, 2 against 1. The guardrail asserts this on the real render: a zone's rendered width must follow its authored span within 15%, which is what catches the classic regression where both siblings inherit the parent band's span and the row silently goes 50/50."
            variant: neutral
          - id: p2-w-h2
            order: 2
            kicker: NESTED
            title: "Inside, cells again"
            description:
              - "this zone's own children are"
              - "leaves, so its grid is a grid"
            detail: "The two levels alternate freely: a compound level holds zones, and each zone's own level is a leaf grid with real tracks again. Every dial resets to its literal meaning one level down."
            variant: neutral
      - id: p2-w-light
        title: "One third"
        subtitle: "span: 1"
        variant: neutral
        order: 2
        span: 1
        columns: 1
        children:
          - id: p2-w-l1
            order: 1
            kicker: WEIGHT
            title: "span: 1 of the same row"
            description:
              - "half of what its sibling gets"
              - "authored, not measured"
            detail: "The weight is a claim about IMPORTANCE OR VOLUME that you author, and the layout obeys it. A zone that carries less says so by weighing less — the width is the argument, not a leftover."
            variant: neutral

  # ── ROW 2, RIGHT · the fourth track, and what asserts it ──────────────────
  # The `span: 1` sibling that makes the row a genuine PARTIAL split: 3 + 1 = the
  # four tracks the root declared, so the rectangle closes with neither a hole nor a
  # band. It carries the case the two sides of row 1 cannot: a compound level whose
  # `span` is a track count, which is what the page root becomes once it holds a
  # band — and the one shape whose truth only the BROWSER holds, since the
  # arithmetic closes this row from the YAML whether or not the stylesheet
  # implements `grid-column: span var(--span)` at this level.
  - id: p2-third
    title: "One track of four"
    subtitle: "span: 1 — the track the wide half left"
    variant: neutral
    order: 4
    span: 1
    columns: 1
    children:
      - id: p2-t-band
        order: 1
        kicker: ROOT
        title: "A band makes a grid"
        description:
          - "every child of the root is a"
          - "section, and it is a grid anyway"
        detail: "The page root holds nothing but sections, so by the rule on the right its <code>columns</code> should be inert and its <code>span</code> a weight. One child changes that: a full-width band. <code>.sec-plane > .sec-grid.sec-compound:has(> .msp)</code> matches, the root becomes <code>display:grid</code> over the authored tracks, and <code>flex-grow</code> is not read here at all."
        variant: neutral
      - id: p2-t-tracks
        order: 2
        kicker: TRACKS
        title: "So span counts again"
        description:
          - "3 of 4 took three tracks;"
          - "this one takes the fourth"
        detail: "In a real grid the number is literal: the section beside this one declares <code>span: 3</code> and occupies exactly three of the root's four tracks, leaving this one the fourth. Only the render can confirm it — the arithmetic closes <code>3 + 1 == 4</code> from the YAML and has never seen a pixel, while invariant Q compares the REAL width against the authored span within 15% and is the one check that catches a stylesheet missing the rule, where the wide half is auto-placed into ONE track and drawn at a quarter of what it is owed."
        variant: neutral

  # ── ROW 3 · MIXING, DONE WELL — phase zones divided by vertical separators ─
  # This is what a real timeline does and it is legal: sections for the phases,
  # separators as the weak dividers between them, on one compound row. The cost
  # is exactly what the rows above enumerate — and it is paid knowingly.
  # `span: 4` == the root's columns, so this section is the full-width BAND that put
  # the root into its grid in the first place.
  - id: p2-mix
    title: "Mixing is legal"
    subtitle: "phase zones divided by vertical separators — a real timeline row"
    variant: neutral
    order: 5
    span: 4
    columns: 3
    children:
      - id: p2-m-phase-1
        title: "Phase one"
        variant: neutral
        order: 1
        span: 1
        columns: 1
        children:
          - id: p2-m-b1
            order: 1
            kicker: ZONE
            title: "A zone, not a cell"
            description:
              - "each phase is a section, so"
              - "this whole row is compound"
            detail: "A phase is a distinct thing with parts of its own, so it is a section — that is principle 7, structure as the assertion. Making the phases zones is what turns this row compound, and the row's dials change accordingly."
            variant: neutral
      - id: p2-m-sep-1
        type: separator
        treatment: [vertical]
        order: 2
        style: dotted
      - id: p2-m-phase-2
        title: "Phase two"
        variant: neutral
        order: 3
        span: 1
        columns: 1
        children:
          - id: p2-m-b2
            order: 1
            kicker: LEAF
            title: "The divider is a leaf"
            description:
              - "a separator sits on the same"
              - "row, mixed in with the zones"
            detail: "The vertical separators beside this zone are LEAF components sharing a row with sections — the mix the principle warns about, here on purpose. A separator is a WEAK divider: it separates within one level. If the two sides were genuinely distinct things, they would be sections, not a line."
            variant: neutral
      - id: p2-m-sep-2
        type: separator
        treatment: [vertical]
        order: 4
        style: dotted
      - id: p2-m-phase-3
        title: "Phase three"
        variant: neutral
        order: 5
        span: 1
        columns: 1
        children:
          - id: p2-m-b3
            order: 1
            kicker: COST
            title: "Mixed knowingly"
            description:
              - "the price is the dials above"
              - "paid for a row that reads"
            detail: "Mixing is not forbidden — it is a trade. Here it buys a timeline whose phases are real zones with their own contents, and the price is the one enumerated on this page: <code>columns</code> goes inert, <code>span</code> becomes a weight, <code>rowspan</code> disappears, and the cell invariants stop measuring this level. Mix when the row is worth it; know what you gave up."
            variant: neutral
