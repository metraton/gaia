# Starter page. id lives here (+ cross-referenced in ../document.yaml);
# name/order/visible live in the manifest. This file is pure page content:
# layout, columns, filters, sections. See the diagram-builder dialect
# reference (../GLOSSARY.md, ../reference.md) for every field.
#
# LAYOUT MODEL — a filled grid of uniform-height cells:
#   • every leaf component is one cell: cells are equal `fr` and fill their row;
#     columns collapse before a cell degrades — no horizontal scroll.
#   • a node WITH `children` is a SECTION (a grid); WITHOUT it, a COMPONENT (leaf).
#   • `columns: N` = how many columns THIS section's grid has (default 2).
#   • `span: M` = an Excel-style MERGE: a child occupies M columns of its parent.
#     `span == columns` is a full-width BAND that takes its own row (place a band
#     LAST to pin it as a base layer); `1 < span < columns` is a PARTIAL merge
#     that occupies exactly M of the N tracks (see Section E below).
#   • `rowspan: K` = a VERTICAL merge: a leaf cell occupies K rows (K× the cell
#     height) — the base for a bar chart where a cell's HEIGHT is its magnitude
#     (see Section D below).
#   • children flow in `order` (then list order), packing side by side until a
#     band forces a new full row.
#   • the page root is itself a section: `columns` below is the root column count
#     and `sections` is the root's children.
#   • a component (leaf) chooses its `type`: box (default) | separator | rail.
#
# THIS PAGE'S JOB — COMPOSITIONS AND EDGE CASES. The principle pages (p1–p9)
# each carry exactly ONE idea, in its cleanest form. This page carries what none
# of them needs but the engine must keep supporting: the compositions and the
# borderline cases. Five of them live ONLY here, and three are the only live
# subjects the G and X invariants have —
#   • a RESERVED chip with no members (the `all` reset, in `filters` below);
#   • TWO TREATMENTS composed on one leaf (Section J);
#   • a LONE BOX sibling of sections inside a row of zones (Section I);
#   • a VERTICAL rail and separator sitting DIRECTLY in a row of zones (Section F);
#   • a SIX-COLUMN band whose collapse cascade generalises to any N (Section H).
# Section A indexes all five, so the page states its own remit.

id: overview
layout: grid
# Root: a 2-column canvas. Section A and Section B are span 1 (inline), so they
# sit side by side on row 1; Sections C/D/E are span 2 (== columns), so each is a
# full-width band on its own row beneath them.
columns: 2

filters:
  # EDGE CASE 1 — the RESERVED chip. `all` is the reset: it declares no members
  # and no component ever lists it, which for any OTHER key is an orphan chip and
  # a hard CHIP failure. It is the only exemption the referential-integrity check
  # carries, and this page is where that exemption is exercised.
  - key: all
    label: "All"
  - key: flow
    label: "Example flow"
    steps:
      - "Chips are flows: click one to spotlight every component that declares it and dim the rest."
      - "A component joins a flow by listing the filter key in its own <code>filters</code>."
      - "Here the flow traces Why this page → Item 3 → Item 7."

sections:

  # ── ROW 1, LEFT · THE PAGE'S REMIT — one cell per case that lives only here ──
  # This section is ALSO the fix for the void this row used to carry: a 1-row leaf
  # grid (130px) beside Section B's 3-deep nested stack (488px) was stretched by
  # the row and left ~358px of trailing space nobody authored. The content is now
  # balanced instead — 6 cells over 3 rows (406px) against Section B's 464px, the
  # same ~58px of stretch the deck already carries in the Tall block row. The
  # cells were not invented to fill space: each names one case this page holds.
  - id: section-a
    title: "Compositions and edge cases"
    subtitle: "what the principle pages do not need — and the engine must keep supporting"
    variant: neutral
    order: 1
    span: 1
    columns: 2
    children:
      - id: item-1
        order: 1
        kicker: REMIT
        title: "Why this page"
        description:
          - "p1–p9 carry one idea each"
          - "the compositions live here"
        detail: "Each principle page states ONE idea in its cleanest form. The cases that are compositions of several tools, or that sit on the edge of what the model allows, would muddy those pages — but they still have to be rendered, and a regression in them still has to be caught. That is this page's whole job: it is the deck's edge-case fixture, and the five cells beside this one are its inventory."
        variant: accent
        filters: [flow]
      - id: item-2
        order: 2
        kicker: CASE 1
        title: "Reserved chip"
        description:
          - "a filter with zero members"
          - "the reset, not an orphan"
        detail: "A chip that no component references is an orphan and a hard CHIP failure — except <code>all</code>, the reserved reset key, which declares no members BY DESIGN. This page carries the only instance of it, so the exemption is exercised rather than merely written down."
        variant: neutral
      - id: case-two-treatments
        order: 3
        kicker: CASE 2
        title: "Two treatments"
        description:
          - "one leaf composing two"
          - "structural modifiers at once"
        detail: "Section J's cells carry <code>[centered, outside]</code> and <code>[half, centered]</code> — a colour role AND two structural treatments on the SAME leaf. Composition is the point of making <code>treatment</code> a list, and this is the only page that composes two of them, so it is the only place the composition can regress and be seen."
        variant: neutral
      - id: case-lone-box
        order: 4
        kicker: CASE 3
        title: "A lone box"
        description:
          - "a leaf sibling of sections"
          - "inside a row of zones"
        detail: "Section I's <code>Card</code> is a plain box standing among nested sections in a compound row. It is one of the only two live subjects invariant G has: G fails the moment that box balloons to an equal flex slice instead of staying card-sized. Retire this page and G asserts nothing."
        variant: neutral
      - id: case-vertical-in-row
        order: 5
        kicker: CASE 4
        title: "Vertical in a row"
        description:
          - "a rail and a separator"
          - "directly among zones"
        detail: "Section F puts a <code>vertical</code> rail and a <code>vertical</code> separator DIRECTLY into a compound row beside two sub-sections. They must stay content-sized (<code>flex: 0 0 auto</code>) instead of taking an equal share — the second subject of invariant G, and the geometry invariant X reads for sibling collision."
        variant: neutral
      - id: case-cascade
        order: 6
        kicker: CASE 5
        title: "Six columns"
        description:
          - "the collapse cascade at any N"
          - "not an enumerated per-N rule"
        detail: "Section H is a six-column band. The cascade used to be enumerated per column count, which left a 6+-column grid uncollapsed between ~640 and 1000px where it could overflow. The general …→2→1 rule is asserted here and nowhere else, because no principle page needs more than four columns."
        variant: neutral

  # ── ROW 1, RIGHT · an inline NESTED section (span 1): a grid of grids ──
  # `treatment: [envelope]` = a borderless dashed container that groups nested
  # sections. It is a STRUCTURAL treatment, not a colour: this section makes no
  # colour claim (`variant: neutral`) yet still changes how its frame is drawn —
  # the two axes are independent.
  - id: section-b
    title: "Section B"
    subtitle: "a section can nest other sections — a grid of grids"
    variant: neutral
    treatment: [envelope]
    order: 2
    span: 1
    columns: 1
    children:
      - id: group-1
        title: "Group 1"
        variant: good
        columns: 1
        children:
          - id: item-3
            kicker: INTERNAL
            title: "Item 3"
            description:
              - "one level of nesting deep"
            detail: "A nested section is drawn as its own framed zone inside the parent. Its <code>variant</code> (here <code>good</code>) tints the whole group."
            variant: good
            filters: [flow]
      # `treatment: [plain]` = a bare structural wrapper: no frame, no background,
      # no min-height. It stacks its children with nothing drawn around them —
      # compare Group 1's framed `safe` zone beside it. It also carries NO
      # title/subtitle, which is what "nothing drawn around them" actually means:
      # the engine only emits a section header when one is authored, so a plain
      # wrapper with a header would contradict its own treatment.
      - id: group-2
        variant: neutral
        treatment: [plain]
        columns: 1
        children:
          - id: item-4
            kicker: INTERNAL
            title: "Item 4"
            description:
              - "another nested group"
            detail: "Sections nest as deep as the idea needs — a recursive grid of grids down to the boxes at the leaves."
            variant: neutral
          - id: item-5
            kicker: INTERNAL
            title: "Item 5"
            description:
              - "stacks below Item 4 (columns: 1)"
            detail: "This group is <code>columns: 1</code>, so its two boxes stack. The <code>muted</code> variant gives a box its own secondary fill."
            variant: muted

  # ── ROW 2 · a full-width BASE BAND (span 2 == root columns) ──
  # A columns:3 leaf grid: a labeled separator spans the whole band (its own
  # row), then a rail swimlane label leads a row of uniform step cells.
  - id: section-c
    title: "Section C"
    subtitle: "span == columns makes this a full-width band on its own row"
    variant: neutral
    order: 3
    span: 2
    columns: 3
    children:
      - id: sep-c
        type: separator
        order: 1
        span: 3
        style: dotted
        text: "A labeled separator"
      - id: rail-c
        type: rail
        order: 2
        title: "Rail"
      - id: item-6
        order: 3
        kicker: UNCHANGED
        title: "Item 6"
        description: ["the rail labels this row"]
        detail: "A rail is a swimlane-style label banner; a separator is a thin divider line. Both are structural leaf types, not data-carrying boxes."
      - id: item-7
        order: 4
        kicker: NEW
        title: "Item 7"
        description: ["the last step in the example flow"]
        detail: "Click the <b>Example flow</b> chip above to trace Item 1 → Item 3 → Item 7 end to end."
        variant: accent
        filters: [flow]

  # ── ROW 3 · a full-width BAND — a mini BAR CHART built from row-span cells ──
  # A columns:3 leaf grid: three cells with rowspan 1, 2, 3 side by side, so the
  # HEIGHT of each cell encodes its magnitude (a bar chart made of grid cells).
  - id: section-d
    title: "Section D"
    subtitle: "a mini bar chart — rowspan 1, 2, 3: a cell's HEIGHT encodes its magnitude"
    variant: neutral
    order: 4
    span: 2
    columns: 3
    children:
      - id: bar-1
        order: 1
        rowspan: 1
        title: "1"
        description: ["rowspan: 1", "height = 1 cell"]
        variant: neutral
      - id: bar-2
        order: 2
        rowspan: 2
        title: "2"
        description: ["rowspan: 2", "height = 2 cells"]
        variant: good
      - id: bar-3
        order: 3
        rowspan: 3
        title: "3"
        description: ["rowspan: 3", "height = 3 cells"]
        variant: accent

  # ── ROW 4 · a full-width BAND — a PARTIAL horizontal merge (2 of 4) ──
  # A columns:4 leaf grid whose merge is REAL: `span: 2` is only a partial merge
  # if the grid actually HAS four tracks, and the grow-with-content clamp gives a
  # grid only as many tracks as its single cells can fill (max(singleCells,
  # maxSpan), never above the authored count). With two single cells the clamp cut
  # this grid to 2 tracks, so `span: 2` rendered as a FULL-WIDTH BAND while the
  # title still promised a 2-of-4 merge. The six single cells below are what earn
  # the four tracks: row 1 is A + B + the 2-track merge, row 2 is four singles, so
  # the rectangle closes exactly (6×1 + 1×2 = 8 = 4 tracks × 2 rows).
  - id: section-e
    title: "Section E"
    subtitle: "a partial merge — Item C spans 2 of 4 real tracks, earned by the six single cells around it"
    variant: neutral
    order: 5
    span: 2
    columns: 4
    children:
      - id: item-a
        order: 1
        span: 1
        kicker: UNCHANGED
        title: "Item A"
        description: ["one cell of four"]
      - id: item-b
        order: 2
        span: 1
        kicker: UNCHANGED
        title: "Item B"
        description: ["one cell of four"]
      - id: item-c
        order: 3
        span: 2
        kicker: NEW
        title: "Item C — span 2"
        description: ["occupies exactly 2 of the 4 tracks"]
        detail: "A partial merge (1 &lt; span &lt; columns) occupies exactly that many tracks and keeps its proportion as the grid collapses; only a span == columns child becomes a full-width band. It is partial only while the grid has more tracks than the span — which is why the row below it is authored."
        variant: accent
      - id: item-d
        order: 4
        span: 1
        kicker: TRACK 1
        title: "Item D"
        description: ["the second row proves", "the grid has four tracks"]
        detail: "The grow-with-content clamp counts SINGLE cells: four of them are the minimum that lets a columns:4 grid keep four tracks. Without this row the clamp would fold the grid to 2 tracks and Item C's <code>span: 2</code> would silently become a full-width band."
      - id: item-e
        order: 5
        span: 1
        kicker: TRACK 2
        title: "Item E"
        description: ["a single cell — the unit", "the clamp counts"]
      - id: item-f
        order: 6
        span: 1
        kicker: TRACK 3
        title: "Item F"
        description: ["one cell of four again"]
      - id: item-g
        order: 7
        span: 1
        kicker: TRACK 4
        title: "Item G"
        description: ["and the rectangle closes", "6×1 + 1×2 = 4 × 2"]

  # ── ROW 5 · two INLINE sub-decks side by side — the guardrail's fix-1/fix-2 cases ──
  # These two span:1 sections sit side by side on their own root row (like A + B),
  # so they are NOT full-width bands (the Y band-fill invariant does not apply to
  # them). Their job is to give the guardrail geometry to assert against:
  #   • fix-1 — "Tall block" is a COMPOUND row (its children are sub-sections):
  #     a rail label + a vertical separator sit DIRECTLY in that flex row and must
  #     stay CONTENT-sized (flex:0 0 auto), not balloon to an equal flex share.
  #   • fix-2 — "Short stack" is a columns:1 stack of sub-sections that is SHORTER
  #     than "Tall block"; the row's align-items:stretch stretches it, and the
  #     .sec-c1 > * reset keeps its children at content height so the taller one
  #     never OVERFLOWS onto the next (the sibling collision the X invariant guards).
  - id: section-f
    title: "Tall block"
    subtitle: "a compound row — rail + vertical separator dividing two sub-sections"
    variant: neutral
    order: 6
    span: 1
    columns: 2
    children:
      - id: rail-f
        type: rail
        treatment: [vertical]
        order: 1
        title: "Lane"
      - id: grp-l
        title: "Left group"
        variant: neutral
        order: 2
        columns: 1
        children:
          - id: l-1
            kicker: STEP
            title: "Step 1"
            description: ["tall sub-section"]
          - id: l-2
            kicker: STEP
            title: "Step 2"
            description: ["four stacked cells"]
          - id: l-3
            kicker: STEP
            title: "Step 3"
            description: ["makes this block tall"]
          - id: l-4
            kicker: STEP
            title: "Step 4"
            description: ["the taller sibling"]
      - id: sep-f
        type: separator
        treatment: [vertical]
        order: 3
      - id: grp-r
        title: "Right group"
        variant: neutral
        order: 4
        columns: 1
        children:
          - id: r-1
            kicker: NOTE
            title: "Note A"
            description: ["a shorter sub-section"]
          - id: r-2
            kicker: NOTE
            title: "Note B"
            description: ["beside the separator"]
  - id: section-g
    title: "Short stack"
    subtitle: "columns:1 stack — shorter, so the row stretches it"
    variant: neutral
    treatment: [envelope]
    order: 7
    span: 1
    columns: 1
    children:
      - id: gg-1
        title: "Group A"
        variant: neutral
        columns: 1
        children:
          - id: gg-1-box-1
            kicker: INTERNAL
            title: "One item"
            description: ["a stacked sub-section"]
          - id: gg-1-box-2
            kicker: INTERNAL
            title: "Two item"
            description: ["with a second cell"]
          - id: gg-1-box-3
            kicker: INTERNAL
            title: "Three item"
            description: ["a third stacked cell — makes Group A the content-heavy",
              "sub-section, so if the columns:1 reset regressed it would be the",
              "one starved by a divided height and overflow onto Group B"]
      - id: gg-2
        title: "Group B"
        variant: neutral
        columns: 1
        children:
          - id: gg-2-box
            kicker: INTERNAL
            title: "Another item"
            description: ["stretched taller than its content"]

  # ── ROW 6 · a SIX-COLUMN BAND — the collapse cascade generalises to ANY N ──
  # A columns:6 leaf grid proves the …→2→1 cascade is no longer enumerated per
  # column count (the old sec-c3/c4/c5 rules left a 6+-column grid uncollapsed
  # between ~640 and 1000px, where it could overflow — invariant O). Here it is
  # 6 cells wide above 1000px, folds to the 2-col "two-table" step at medium, and
  # to 1 column at the narrow endpoint — all asserted green by F and O.
  - id: section-h
    title: "Section H"
    subtitle: "a six-column band — the collapse cascade now generalises to any N (6 → 2 → 1)"
    variant: neutral
    order: 8
    span: 2
    columns: 6
    children:
      - id: h-1
        kicker: STEP
        title: "One"
        description: ["cell 1 of 6"]
      - id: h-2
        kicker: STEP
        title: "Two"
        description: ["cell 2 of 6"]
      - id: h-3
        kicker: STEP
        title: "Three"
        description: ["cell 3 of 6"]
      - id: h-4
        kicker: STEP
        title: "Four"
        description: ["cell 4 of 6"]
      - id: h-5
        kicker: STEP
        title: "Five"
        description: ["cell 5 of 6"]
      - id: h-6
        kicker: STEP
        title: "Six"
        description: ["cell 6 of 6"]

  # ── ROW 7 · a MIXED COMPOUND band — span-weighted sections + a lone box ──
  # A compound grid (its children include sections) whose section widths FOLLOW
  # CONTENT WEIGHT: "Heavy" carries span:2 so it grows twice as wide as the span:1
  # "Light", instead of the two splitting the row 50/50 (the branchkinect GCP-vs-
  # Cloud SQL residual). The lone "Card" box is a LEAF sibling of the sections: it
  # sizes to CONTENT (a fixed-height card), never ballooning to an equal flex
  # slice. Both behaviours are hard-guarded by invariant G.
  - id: section-i
    title: "Section I"
    subtitle: "a mixed compound — Heavy (span:2) is wider than Light (span:1); the lone Card box stays card-sized"
    variant: neutral
    order: 9
    span: 2
    columns: 4
    children:
      - id: heavy
        title: "Heavy"
        subtitle: "span:2 — grows twice as wide"
        variant: neutral
        order: 1
        span: 2
        columns: 2
        children:
          - id: heavy-1
            kicker: NEW
            title: "Alpha"
            description: ["content-heavy section"]
          - id: heavy-2
            kicker: NEW
            title: "Beta"
            description: ["four boxes in two columns"]
          - id: heavy-3
            kicker: NEW
            title: "Gamma"
            description: ["so it earns the width"]
          - id: heavy-4
            kicker: NEW
            title: "Delta"
            description: ["span:2 → flex-grow 2"]
      - id: card
        type: box
        order: 2
        kicker: NOTE
        title: "Card"
        description: ["a lone box beside sections", "sizes to content, never balloons"]
        detail: "This box is a LEAF sibling of the two sections in a compound grid. Because ANY section child makes the grid compound, a naive rule would give this box an equal flex slice and balloon it. Instead it sizes to its content and keeps the uniform cell height — invariant G fails if it ever grows."
      - id: light
        title: "Light"
        subtitle: "span:1 — grows half as wide"
        variant: neutral
        order: 3
        span: 1
        columns: 1
        children:
          - id: light-1
            kicker: UNCHANGED
            title: "Solo"
            description: ["a lighter section"]

  # ── ROW 8 · a full-width BAND — the STRUCTURAL TREATMENT axis ──
  # `variant` (colour) and `treatment` (structure) are ORTHOGONAL, which a single
  # closed enum could never express. This section makes NO colour claim
  # (`variant: neutral`) yet still restyles its frame (`treatment: [envelope]`), and
  # its cells compose a colour role with structural modifiers freely:
  #   • `vertical` — the title runs DOWN the block axis (a rotated lane label).
  #     Same switch the old `orientation: vertical` spelled on a rail/separator,
  #     now one value on one axis, available to any leaf.
  #   • `half` — DIVIDES a slot instead of shrinking a cell: two halves stack
  #     inside ONE full-height cell, so the rectangle stays FULL and no hole
  #     appears. Halves pair by ADJACENCY and must come in twos (an odd one is a
  #     build error). --cell-h is untouched at 130px; each half gets 63px, which is
  #     why `half` is TITLE-ONLY — a description on one is a build error.
  #   • `centered` / `ext` — centre the text block / draw a dashed frame. Both
  #     compose with a colour role, and here with each other and with `half`.
  - id: section-j
    title: "Section J"
    subtitle: "the treatment axis — a vertical label, two half-slot pairs, composed treatments"
    variant: neutral
    treatment: [envelope]
    order: 10
    span: 2
    columns: 4
    children:
      - id: j-lane
        order: 1
        kicker: LANE
        title: "Lane"
        treatment: [vertical]
        detail: "A <code>vertical</code> treatment rotates the text onto the block axis, the same reading direction as a <code>rail</code>. Because the title no longer flows horizontally, the word-fit invariant (N) does not apply to it — its applicability clause exempts vertical leaves."
      - id: j-h1
        order: 2
        kicker: TOP
        title: "Half A"
        treatment: [half]
        detail: "Two <code>half</code> components share ONE grid slot: this is the top half. The slot keeps the full 130px cell height, so the grid's rows, tracks and fill are unchanged — a half pair reads as one full cell from the outside."
      - id: j-h2
        order: 3
        kicker: BOTTOM
        title: "Half B"
        treatment: [half]
        detail: "The bottom half of the same slot. Invariant U now asserts the height of the SLOT rather than of the component, which is what lets a half legitimately be a fraction of the cell without leaving a hole."
      - id: j-center
        order: 4
        kicker: NEW
        title: "Centered"
        description: ["colour and structure compose"]
        variant: good
        treatment: [centered, outside]
        detail: "This cell carries a colour role (<code>good</code>) AND two structural treatments (<code>centered</code>, <code>outside</code>) at once — the composition a single closed <code>variant</code> enum made impossible, and the reason <code>centered</code> once had to be smuggled in through <code>variant_extra</code>."
      - id: j-h3
        order: 5
        kicker: TOP
        title: "Half C"
        variant: muted
        treatment: [half, centered]
        detail: "A second half pair, this one composing a colour role (<code>muted</code> — a fill, so it stays a variant) with TWO treatments."
      - id: j-h4
        order: 6
        kicker: BOTTOM
        title: "Half D"
        variant: muted
        treatment: [half, centered]
        detail: "The bottom half of the second pair. Both members of a pair must declare the same <code>span</code>, since they share one slot."
