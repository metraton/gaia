# PRINCIPLE 6 — "The grid does not draw relations: it lights them."
#
# One page, one principle. The page DEMONSTRATES the principle that names it,
# and the content of every box EXPLAINS the tool that box is demonstrating —
# so the deck is its own documentation and the guardrail keeps it honest.
#
# A grid has no edges to draw, so there are no arrows anywhere in the dialect.
# A relation is expressed as a FILTER CHIP: every component that declares the
# chip's `key` belongs to it, and clicking the chip LIGHTS the membership and
# dims everything else. Two kinds exist — a directional FLOW, made legible by
# `order` because there is no arrowhead to point with, and a cross-cutting
# CONCEPT that ignores section boundaries entirely.
#
# FORM: flow. Deliberate, and deliberately the SAME form as p3: the two pages
# teach the two halves of one fact. p3 shows that `order` is the only coordinate;
# this page shows that `order` is therefore the only thing that can make a
# relation directional. `flow` also keeps the word-fit floor — right for a page
# whose cells carry real sentences — and drops the orphan-row and verticality
# checks, right for a page that is two bands over a paired row.
#
# WHAT IT EXERCISES: a directional FLOW chip whose kickers and `order` read
# 1 → 2 → 3 · a cross-cutting CONCEPT chip with members in three different
# sections · one cell belonging to BOTH relations at once · the arity rule
# explained rather than authored (a one-member chip is rejected by
# `npm run check`, so the seed cannot contain one) · a `key` REUSED from p3, to
# show that the same slug declared on two pages projects one onto the other.

id: p6-relations
layout: grid
form: flow
# Two root columns: the two bands each take a full row, and the two sections the
# concept chip crosses share the row beneath them.
columns: 2

filters:
  # REUSED KEY. `packing` is also declared on p3, where it traces the packing
  # order. The slug is per-page — the engine scopes chips and members to the
  # active page — so reusing it makes no cross-page mess; what it does is
  # project one page onto the other: the reader who lit `packing` on p3 finds the
  # same relation named here, on the page that explains why it is directional.
  - key: packing
    label: "A directional flow"
    steps:
      - "Click the chip to light the three cells of the flow, in the order they are authored."
      - "There is no arrowhead: the direction is carried by <code>order</code> and by the kickers 1 · 2 · 3."
      - "The same key is declared on page 3, where it traces the packing order — one slug, two pages."
  - key: crosscut
    label: "A cross-cutting concept"
    steps:
      - "Click the chip to light members in THREE different sections at once."
      - "A concept chip is not a path: nothing about it reads in an order, and it never leaves a section out."
      - "One cell belongs to this relation AND to the flow above — membership is a list, not a category."

sections:

  # ── ROW 1 · WHAT A CHIP IS, AND WHY THERE ARE NO ARROWS ───────────────────
  # Three single cells in three tracks. The third one carries the arity rule,
  # which is the only thing on this page that must be TOLD rather than shown:
  # the checker rejects a one-member chip, so the deck cannot demonstrate one.
  - id: p6-what
    title: "It lights, it does not draw"
    subtitle: "a chip is a relation expressed as membership — the grid has no edges"
    variant: neutral
    order: 1
    span: 2
    columns: 3
    children:
      - id: p6-w-arrow
        order: 1
        kicker: NO EDGE
        title: "There are no arrows"
        description:
          - "the grid draws cells"
          - "never lines between them"
        detail: "Nothing in the dialect can draw an edge from one cell to another — a <code>separator</code> is a divider, not a connector, and there is no coordinate space to route a line through. So a relation cannot be DRAWN, and the substitute is not a weaker arrow: it is membership."
        variant: neutral
      - id: p6-w-chip
        order: 2
        kicker: MEMBERS
        title: "The cell owns its tags"
        description:
          - "a component declares keys"
          - "the chip is the index"
        detail: "A component lists the keys it belongs to in <code>filters</code>, and the engine builds the inverse index by walking the tree — so there is no central node list to maintain. Lighting a chip adds <code>.lit</code> to every member and to its enclosing section, and dims the rest of the canvas."
        variant: neutral
      - id: p6-w-arity
        order: 3
        kicker: ARITY
        title: "Two ends or nothing"
        description:
          - "one member is no relation"
          - "and it blacks out the page"
        detail: "A one-member chip cannot be shown on this page, because <code>npm run check</code> FAILS it (CHIP arity): a relation needs two ends, and since an active chip dims everything it does not name, a chip with a single member switches the whole canvas off to spotlight one box. A chip with ZERO members fails the same check from the other direction. The rule is enforced, so the defect is stated here in words instead of authored."
        variant: warn

  # ── ROW 2 · THE FLOW CHIP — direction carried by `order` ──────────────────
  # Three cells, orders 1 · 2 · 3, all members of `packing`. The kickers repeat
  # the number so the direction survives a reader who never clicks the chip.
  # The middle cell also belongs to `crosscut`, which is what shows that
  # membership is a LIST rather than a classification.
  - id: p6-flow
    title: "A flow, read in one direction"
    subtitle: "no arrowhead exists — so order and position carry the direction"
    variant: neutral
    order: 2
    span: 2
    columns: 3
    children:
      - id: p6-f-1
        order: 1
        kicker: "1"
        title: "Where it starts"
        description:
          - "first in order"
          - "so leftmost in the row"
        detail: "This cell is the flow's first end. It reads as first for two independent reasons: it is authored first, and its kicker says so. Neither is an arrow, and together they are enough."
        variant: neutral
        filters: [packing]
      - id: p6-f-2
        order: 2
        kicker: "2"
        title: "The middle, twice over"
        description:
          - "second in the flow"
          - "and in the concept too"
        detail: "The only cell on this page in TWO relations: it lists both <code>packing</code> and <code>crosscut</code>. Membership is a list, so a cell can sit on a path and also belong to a theme that cuts across the page — the two chips light overlapping, not exclusive, sets."
        variant: accent
        filters: [packing, crosscut]
      - id: p6-f-3
        order: 3
        kicker: "3"
        title: "Where it ends"
        description:
          - "last in order"
          - "so last in the reading"
        detail: "The far end of the relation. When the chip lights, these three cells are the only lit ones in this section, and the eye reads them left to right because that is where <code>order</code> put them. Change the orders and the flow reverses — there is nothing else to edit."
        variant: neutral
        filters: [packing]

  # ── ROW 3, LEFT · one end of the cross-cutting CONCEPT ────────────────────
  # Two cells: one is a member, one is not, so the dimming is visible inside a
  # single section rather than only between sections.
  - id: p6-left
    title: "One section"
    subtitle: "a member and a non-member, side by side"
    variant: neutral
    order: 3
    span: 1
    columns: 2
    children:
      - id: p6-l-in
        order: 1
        kicker: CONCEPT
        title: "Tagged here"
        description:
          - "a member of the chip"
          - "in this section"
        detail: "One end of the <code>crosscut</code> relation. A concept chip groups by theme, status or ownership — anything true of several cells at once — and it has no direction: there is no first or last member, only membership."
        variant: neutral
        filters: [crosscut]
      - id: p6-l-out
        order: 2
        kicker: DIMMED
        title: "Not tagged"
        description:
          - "declares no key"
          - "so it dims when lit"
        detail: "A non-member in the same section. When the chip is active this cell dims while its neighbour lights, which is why the section itself also gains <code>.lit</code> — the zone frame tells you the relation reaches in here, and the cells tell you how far."
        variant: muted

  # ── ROW 3, RIGHT · the other end, in a DIFFERENT section ──────────────────
  # Same shape as the left, which is what makes the crossing legible: the
  # relation is identical on both sides of a boundary the grid drew.
  - id: p6-right
    title: "Another section"
    subtitle: "the same relation, across a boundary the grid drew"
    variant: neutral
    order: 4
    span: 1
    columns: 2
    children:
      - id: p6-r-in
        order: 1
        kicker: CONCEPT
        title: "Tagged there too"
        description:
          - "the other end"
          - "in a different section"
        detail: "The second end, in a section of its own. Nothing connects the two cells structurally — no span, no nesting, no line. They are related because they name the same key, which is the whole mechanism: a relation is a shared name, not a shared position."
        variant: neutral
        filters: [crosscut]
      - id: p6-r-out
        order: 2
        kicker: DIMMED
        title: "Also not tagged"
        description:
          - "position never implies"
          - "membership"
        detail: "Its neighbour is a member and it is not, although they sit in the same cell grid — which is the negative case that makes the point: being beside a member is not being related. Only the declared key is."
        variant: muted
